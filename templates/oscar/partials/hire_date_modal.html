<div class="modal fade" id="hireDateModal" tabindex="-1" role="dialog" aria-labelledby="hireDateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="hireDateModalLabel">Select Hire Dates</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="hireStartDate" class="form-label">Start Date (Thursday 5pm)</label>
                        <input type="date" id="hireStartDate" class="form-control" min="">
                        <small class="text-muted">Hire starts Thursday at 5pm</small>
                    </div>
                    <div class="col-md-6">
                        <label for="hireEndDate" class="form-label">End Date (Monday 7pm)</label>
                        <input type="date" id="hireEndDate" class="form-control" min="">
                        <small class="text-muted">Hire ends Monday at 7pm</small>
                    </div>
                </div>
                <div id="hireDateSummary" class="alert alert-info d-none">
                    <strong>Hire Period:</strong> <span id="hirePeriodText"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger" id="clearHireDates">Clear Dates</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmHireDates">Confirm Hire Period</button>
            </div>
        </div>
    </div>
</div>
